name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/$3" .
          }
          build linux   amd64 tui-copier-linux-amd64
          build linux   arm64 tui-copier-linux-arm64
          build windows amd64 tui-copier-windows-amd64.exe
          build darwin  arm64 tui-copier-darwin-arm64
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
